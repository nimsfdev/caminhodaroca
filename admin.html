<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Marmitex Caminho da Roça</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #f1f5f9; padding: 20px; max-width: 800px; margin: auto; color: #333; }
    header { background: #2b4c3f; color: white; padding: 18px; border-radius: 8px; margin-bottom: 20px; text-align: center; }
    header h1 { margin: 0 0 5px 0; font-size: 1.6rem; }
    .box { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.06); }
    input, button { padding: 12px; margin: 6px 0; width: 100%; border-radius: 6px; border: 1px solid #ccc; font-size: 1rem; }
    button { background: #2b4c3f; color: white; font-weight: bold; border: none; cursor: pointer; }
    button:hover { opacity: 0.9; }
    .grade-precos { display: flex; gap: 10px; margin: 6px 0; }
    .btn-del { background: #e63946; width: auto; padding: 8px 14px; font-size: 0.9rem; }
    .item-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding: 12px 0; }
    .pedido-card { display: flex; justify-content: space-between; align-items: center; background: #fff8e6; padding: 15px; border-left: 5px solid #ffb703; margin-bottom: 10px; border-radius: 6px; }
  </style>
</head>
<body>

  <header>
    <h1>🍲 Cozinha - Marmitex Caminho da Roça</h1>
    <p>Cadastre os pratos do dia com preço Médio e Grande</p>
  </header>

  <!-- Pedidos recebidos -->
  <div class="box">
    <h2>🔔 Pedidos Recebidos (Ao Vivo)</h2>
    <div id="listaPedidos">Carregando pedidos...</div>
  </div>

  <!-- Cadastro de Marmitex -->
  <div class="box">
    <h2>➕ Cadastrar Cardápio do Dia</h2>
    <input type="text" id="nome" placeholder="Nome da Marmitex (Ex: Feijoada Completa)">
    <input type="text" id="desc" placeholder="Acompanhamentos (Ex: Arroz, couve, farofa e vinagrete)">
    
    <div class="grade-precos">
      <input type="number" step="0.01" id="precoM" placeholder="Preço Média R$ (Ex: 22.00)">
      <input type="number" step="0.01" id="precoG" placeholder="Preço Grande R$ (Ex: 28.00)">
    </div>

    <button onclick="adicionarMarmitex()">Publicar no Cardápio</button>
  </div>

  <!-- Marmitex ativas -->
  <div class="box">
    <h2>📋 Opções de Marmitex Ativas</h2>
    <div id="listaCardapio">Carregando...</div>
  </div>

  <script>
    const FIREBASE_URL = "https://restaurante-caminho-da-roca-default-rtdb.firebaseio.com/";

    async function adicionarMarmitex() {
      const nome = document.getElementById('nome').value.trim();
      const desc = document.getElementById('desc').value.trim();
      const precoM = parseFloat(document.getElementById('precoM').value);
      const precoG = parseFloat(document.getElementById('precoG').value);

      if (!nome) return alert("Informe o nome do prato!");
      if (isNaN(precoM) || isNaN(precoG)) return alert("Informe os preços para a Marmitex Média e Grande!");

      await fetch(`${FIREBASE_URL}cardapio.json`, {
        method: 'POST',
        body: JSON.stringify({ nome, desc, precoM, precoG })
      });

      document.getElementById('nome').value = '';
      document.getElementById('desc').value = '';
      document.getElementById('precoM').value = '';
      document.getElementById('precoG').value = '';
      carregarDados();
    }

    async function removerRegistro(pasta, id) {
      await fetch(`${FIREBASE_URL}${pasta}/${id}.json`, { method: 'DELETE' });
      carregarDados();
    }

    async function carregarDados() {
      try {
        // Carrega Cardápio
        const resMenu = await fetch(`${FIREBASE_URL}cardapio.json`);
        const dataMenu = await resMenu.json();
        const divMenu = document.getElementById('listaCardapio');
        divMenu.innerHTML = '';

        if (dataMenu) {
          Object.keys(dataMenu).forEach(id => {
            const item = dataMenu[id];
            divMenu.innerHTML += `
              <div class="item-row">
                <div>
                  <strong>${item.nome}</strong><br>
                  <span style="color:#2b4c3f; font-weight:bold;">Média: R$ ${Number(item.precoM).toFixed(2)} | Grande: R$ ${Number(item.precoG).toFixed(2)}</span><br>
                  <small style="color:#666">${item.desc || ''}</small>
                </div>
                <button class="btn-del" onclick="removerRegistro('cardapio', '${id}')">Excluir</button>
              </div>`;
          });
        } else {
          divMenu.innerHTML = '<p>Nenhuma marmitex cadastrada para hoje.</p>';
        }

        // Carrega Pedidos
        const resPed = await fetch(`${FIREBASE_URL}pedidos.json`);
        const dataPed = await resPed.json();
        const divPed = document.getElementById('listaPedidos');
        divPed.innerHTML = '';

        if (dataPed) {
          Object.keys(dataPed).forEach(id => {
            const p = dataPed[id];
            divPed.innerHTML += `
              <div class="pedido-card">
                <div>
                  <strong>👤 Cliente: ${p.cliente}</strong> (${p.horario})<br>
                  <span>🍱 Pedido: ${p.itens}</span><br>
                  <strong>💰 Total: R$ ${Number(p.total).toFixed(2)}</strong>
                </div>
                <button class="btn-del" onclick="removerRegistro('pedidos', '${id}')">Concluir</button>
              </div>`;
          });
        } else {
          divPed.innerHTML = '<p>Nenhum pedido pendente.</p>';
        }
      } catch (e) {
        console.error("Erro ao carregar dados:", e);
      }
    }

    carregarDados();
    setInterval(carregarDados, 3000);
  </script>
</body>
</html>
